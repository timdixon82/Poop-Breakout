# Dependabot configuration.
# Weekly, grouped dependency updates. Remove any ecosystem block the project
# does not use, so Dependabot does not warn about a missing manifest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns: ["*"]
    # Hold TypeScript at its current major. The @typescript-eslint toolchain
    # does not yet support the next TypeScript major, so a grouped bump to it
    # cannot resolve (npm ERESOLVE). Remove this ignore once the ESLint
    # TypeScript packages declare support for the newer TypeScript major.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /.github/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]
