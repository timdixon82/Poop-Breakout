# Accessibility checks at WCAG 2.2 AAA using axe-core and Pa11y.
#
# Runs on every pull request. Builds the Vite project, then serves the dist/
# folder on port 8080, then runs both tools against it.
#
# Note: the canvas game area will report accessibility gaps detected by Carol's
# baseline audit. These gaps are documented as accepted exceptions at
# docs/exceptions/ACC-001-canvas-game-accessibility.md. The pa11y and axe
# runs are still required so that the HTML overlay surfaces (start, game-over,
# level-complete, win screens) pass the automated checks.
#
# No untrusted GitHub context variables are used in run steps.
# Action SHAs verified on 2026-05-23.

name: Accessibility
on:
  pull_request:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install accessibility tools
        run: npm install -g pa11y @axe-core/cli@4.11.3 wait-on@8.0.1 browser-driver-manager@2.0.1

      - name: Install matching ChromeDriver for axe-core
        run: |
          # Detect the Chrome version ChromeDriver will actually use by probing
          # platform-specific paths in the same order ChromeDriver checks them.
          # Using google-chrome-stable --version can return a different binary
          # than what ChromeDriver launches, causing a version mismatch.
          CHROME_MAJOR=""
          for chrome_bin in /opt/google/chrome/chrome /opt/google/chrome/google-chrome \
              /usr/bin/google-chrome /usr/bin/google-chrome-stable; do
            if [ -x "$chrome_bin" ]; then
              CHROME_MAJOR=$("$chrome_bin" --version 2>/dev/null | grep -oE '[0-9]+' | head -1)
              break
            fi
          done
          # Install a Chrome + ChromeDriver pair matching the detected version.
          npx browser-driver-manager install "chrome@${CHROME_MAJOR:-stable}"
          bdm_bin=$(find "$HOME/.browser-driver-manager" -name "chromedriver" -type f 2>/dev/null | head -1)
          if [ -n "$bdm_bin" ]; then
            echo "$(dirname "$bdm_bin")" >> "$GITHUB_PATH"
          fi

      - name: Build CI pa11y config with system Chrome path
        run: |
          CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium 2>/dev/null)
          jq --arg chrome "$CHROME" '.chromeLaunchConfig.executablePath = $chrome' pa11y.json > pa11y.ci.json

      - name: Serve the built site
        run: python3 -m http.server 8080 --directory dist &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 15000

      - name: Pa11y at WCAG 2.2 AAA
        run: pa11y --standard WCAG2AAA --config pa11y.ci.json "http://localhost:8080/Poop-Breakout/"

      - name: axe-core at WCAG 2.2 AAA
        run: axe "http://localhost:8080/Poop-Breakout/" --tags wcag2a,wcag2aa,wcag2aaa,wcag22aa,wcag22aaa --chrome-options="no-sandbox"
